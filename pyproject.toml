[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptwall"
version = "0.1.0"
description = "A layered prompt-injection firewall for LLM applications: taint-tracking proxy with policy-driven tool gating and output guards."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "PromptWall contributors" }]
keywords = ["llm", "security", "prompt-injection", "guardrails", "proxy", "ai-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "regex>=2023.12",
]

[project.optional-dependencies]
ml = ["onnxruntime>=1.17", "numpy>=1.26"]
train = ["scikit-learn>=1.4", "skl2onnx>=1.16", "numpy>=1.26"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.9",
  "types-PyYAML",
]
all = ["promptwall[ml,train,dev]"]

[project.scripts]
promptwall = "promptwall.main:cli"

[project.urls]
Homepage = "https://github.com/promptwall/promptwall"
Documentation = "https://github.com/promptwall/promptwall/tree/main/docs"

[tool.setuptools.packages.find]
include = ["promptwall*"]

[tool.setuptools.package-data]
promptwall = ["policy/rules/*.yaml", "policy/rules/VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:promptwall.*"]
markers = [
  "slow: benchmark-scale tests",
  "integration: exercises the full ASGI app",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["promptwall"]
omit = ["*/tests/*"]
