# PromptWall on Kubernetes.
#
#   kubectl create secret generic promptwall \
#     --from-literal=api-keys="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')" \
#     --from-literal=admin-api-keys="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')" \
#     --from-literal=upstream-api-key=sk-...
#   kubectl apply -f deploy/k8s/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promptwall
  labels: { app: promptwall }
spec:
  replicas: 3
  selector:
    matchLabels: { app: promptwall }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # never reduce capacity in front of live traffic
      maxSurge: 1
  template:
    metadata:
      labels: { app: promptwall }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        # Policy changes roll the pods automatically: kustomize hashes the
        # generated ConfigMap name from the rule files, so editing a rule
        # produces a new name and a new rollout. See kustomization.yaml.
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: promptwall
          image: ghcr.io/matt869/promptwall-:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            # Start in monitor. Flip to enforce only after reading what it
            # would have blocked -- see docs/deployment.md.
            - { name: PW_MODE,      value: "monitor" }
            - { name: PW_FAIL_MODE, value: "open" }
            - { name: PW_LOG_FORMAT, value: "json" }
            - { name: PW_POLICY_DIR, value: "/policy" }
            # More than one replica, so sessions must be shared or cross-turn
            # detection degrades silently.
            - { name: PW_SESSION_BACKEND, value: "redis" }
            - { name: PW_REDIS_URL, value: "redis://promptwall-redis:6379/0" }
            - name: PW_API_KEYS
              valueFrom: { secretKeyRef: { name: promptwall, key: api-keys } }
            - name: PW_ADMIN_API_KEYS
              valueFrom: { secretKeyRef: { name: promptwall, key: admin-api-keys } }
            - name: PW_UPSTREAM_API_KEY
              valueFrom: { secretKeyRef: { name: promptwall, key: upstream-api-key } }
            - { name: PW_UPSTREAM_PROVIDER, value: "openai_compat" }
            - { name: PW_UPSTREAM_BASE_URL, value: "https://api.openai.com/v1" }
          resources:
            # CPU-bound: the pipeline runs regex and feature extraction in a
            # worker thread. Size on cores, not memory.
            requests: { cpu: "500m", memory: "256Mi" }
            limits:   { cpu: "2000m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          # /readyz reports 503 when a non-advisory layer is unavailable, so a
          # degraded pod leaves the endpoints list instead of quietly serving
          # traffic it is not properly inspecting.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 2
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - { name: policy, mountPath: /policy, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: policy
          configMap: { name: promptwall-policy }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: promptwall
  labels: { app: promptwall }
spec:
  selector: { app: promptwall }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: promptwall
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: promptwall }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: promptwall
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: promptwall
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
