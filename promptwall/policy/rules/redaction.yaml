# Redaction rules: values that must not cross a boundary in the clear.
#
# Direction matters and the two are not symmetric:
#   on_input   scrubs before the prompt reaches the model provider
#   on_output  scrubs before the response reaches the caller
#
# Credentials are scrubbed in BOTH directions. Outbound is the obvious case
# (a successful injection makes the model recite a key). Inbound matters too:
# a gateway that forwards live credentials to a third-party API has quietly
# widened the blast radius of that vendor's next breach.
#
# Patterns are anchored on issuer-specific prefixes wherever possible.
# A generic high-entropy matcher would fire on base64 images, UUIDs and
# minified JS, and a redactor that mangles ordinary traffic gets turned off.
version: "1"
description: Secret and PII redaction rules.

rules:
  # --- cloud + vendor credentials ------------------------------------------
  - id: aws_access_key
    description: AWS access key id.
    pattern: '\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'
    severity: critical
    on_input: true
    on_output: true

  - id: aws_secret_key
    description: AWS secret access key in an assignment.
    pattern: '(?i)aws(?:.{0,20})?(?:secret|private)(?:.{0,20})?[=:\s"'']+([A-Za-z0-9/+=]{40})'
    severity: critical
    on_input: true
    on_output: true

  - id: github_token
    description: GitHub personal access / app / refresh token.
    pattern: '\bgh[pousr]_[A-Za-z0-9]{36,255}\b'
    severity: critical
    on_input: true
    on_output: true

  - id: openai_key
    description: OpenAI API key.
    pattern: '\bsk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{20,}\b'
    severity: critical
    on_input: true
    on_output: true

  - id: anthropic_key
    description: Anthropic API key.
    pattern: '\bsk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_-]{80,}\b'
    severity: critical
    on_input: true
    on_output: true

  - id: slack_token
    description: Slack bot, user or app token.
    pattern: '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'
    severity: critical
    on_input: true
    on_output: true

  - id: google_api_key
    description: Google API key.
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'
    severity: critical
    on_input: true
    on_output: true

  - id: stripe_key
    description: Stripe live secret or restricted key.
    pattern: '\b(?:sk|rk)_live_[0-9a-zA-Z]{20,}\b'
    severity: critical
    on_input: true
    on_output: true

  - id: private_key_block
    description: PEM-encoded private key.
    pattern: '-----BEGIN\s+(?:RSA|DSA|EC|OPENSSH|PGP|ENCRYPTED)?\s*PRIVATE KEY(?:\s+BLOCK)?-----'
    severity: critical
    mode: drop
    on_input: true
    on_output: true

  - id: jwt_token
    description: JSON Web Token.
    pattern: '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'
    severity: high
    on_input: true
    on_output: true

  - id: bearer_header
    description: Authorization header captured in text.
    pattern: '(?i)\bauthorization\s*[:=]\s*(?:bearer|basic|token)\s+[A-Za-z0-9._~+/=-]{16,}'
    severity: critical
    on_input: true
    on_output: true

  - id: db_connection_string
    description: Database URI with inline credentials.
    pattern: '(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp|mssql)://[^:\s/]+:[^@\s/]+@[^\s]+'
    severity: critical
    on_input: true
    on_output: true

  - id: generic_secret_assignment
    description: A secret-looking name assigned a long opaque value.
    pattern: '(?i)\b(?:api[_-]?key|secret[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|password|passwd)\b\s*[=:]\s*["'']?([A-Za-z0-9._~+/-]{16,})["'']?'
    severity: high
    on_input: false
    on_output: true

  # --- PII: outbound only ---------------------------------------------------
  # These appear in legitimate prompts constantly. Scrubbing them inbound
  # would break the application; scrubbing them outbound limits what a
  # successful injection can pull out of retrieved records.
  - id: credit_card
    description: Payment card number (Luhn-validated).
    pattern: '\b(?:\d[ -]*?){13,19}\b'
    validator: luhn
    mode: partial
    keep_tail: 4
    severity: critical
    on_output: true

  - id: us_ssn
    description: US Social Security number.
    pattern: '\b(?!000|666|9\d\d)\d{3}-(?!00)\d{2}-(?!0000)\d{4}\b'
    mode: mask
    severity: critical
    on_output: true

  - id: iban
    description: International bank account number.
    pattern: '\b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b'
    mode: partial
    keep_tail: 4
    severity: high
    on_output: true
    ignore_case: false

  - id: email_address
    description: Email address.
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    mode: mask
    severity: low
    on_output: false

  - id: phone_e164
    description: Phone number in E.164 form.
    pattern: '\+\d{1,3}[\s.-]?\(?\d{1,4}\)?[\s.-]?\d{3,4}[\s.-]?\d{3,4}\b'
    mode: partial
    keep_tail: 4
    severity: low
    on_output: false
