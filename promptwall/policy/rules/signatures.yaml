# PromptWall signature pack.
#
# These are high-precision patterns, not a substitute for L2/L3. A signature
# earns its place by being cheap and rarely wrong; anything fuzzy belongs in
# the classifier instead.
#
# max_trust scopes a rule to provenance. Most injection phrasings are merely
# odd in a user turn but near-certain attacks inside a fetched document, so
# they are scoped to `third_party` to keep false positives survivable.
version: "1"
description: Baseline prompt-injection signatures.

signatures:
  # --- instruction override -------------------------------------------------
  - id: io.ignore_previous
    description: Classic instruction-override opener.
    family: instruction_override
    severity: high
    # 'above', 'preceding' and 'foregoing' stand alone as nouns, so the
    # trailing noun is optional for them ("disregard the above and ...").
    # It stays required for the adjective-only words, where dropping it
    # would match ordinary prose like "ignore previous versions".
    #
    # The bare form is additionally required to end the clause. Without that,
    # "disregard the above draft and use the second one" -- an ordinary
    # editing request -- matched, and a rule that fires on ordinary editing
    # requests is a rule an operator turns off.
    pattern: '(?:ignore|disregard|forget|override)\s+(?:all\s+|any\s+|the\s+)?(?:(?:previous|prior|earlier|last)\s+(?:instruction|prompt|direction|rule|command|message|context)s?|(?:above|preceding|foregoing)(?:\s+(?:instruction|prompt|direction|rule|command|message|context)s?\b|(?=\s*(?:[,.;:!?]|$|and\b|then\b|now\b|instead\b))))'
    tags: [classic, high-signal]

  - id: io.ignore_everything
    description: Override phrased against the whole context.
    family: instruction_override
    severity: high
    pattern: '(?:ignore|disregard|forget)\s+(?:everything|all)\s+(?:you\s+)?(?:were\s+|have\s+been\s+)?(?:told|instructed|said|learned)(?:\s+(?:before|above|previously|earlier))?'
    tags: [classic]

  - id: io.new_instructions
    description: Attempts to open a fresh, higher-priority instruction block.
    family: instruction_override
    severity: high
    pattern: '(?:^|\n)\s*(?:new|updated|revised|real|actual|true|corrected)\s+(?:instruction|directive|system\s+prompt|rule)s?\s*[:\-]'
    max_trust: third_party
    tags: [indirect]

  - id: io.system_prompt_spoof
    description: Fake system or role header injected into content.
    family: instruction_override
    severity: critical
    pattern: '(?:^|\n)\s*(?:\[|<|#{1,3}\s*)?(?:system|developer|admin(?:istrator)?)\s*(?:\]|>)?\s*(?:prompt)?\s*[:\-]\s*\S'
    max_trust: third_party
    tags: [indirect, spoof]

  - id: io.instructions_revoked
    description: Claims that earlier instructions no longer apply.
    family: instruction_override
    severity: high
    pattern: '(?:(?:previous|prior|earlier|original|above)\s+(?:instruction|directive|rule|guideline|prompt)s?\s+(?:are|is|have\s+been|has\s+been)\s+(?:cancelled|canceled|revoked|void|obsolete|superseded|no\s+longer\s+(?:valid|active|in\s+effect)))|(?:(?:new|updated|these)\s+(?:instruction|directive|rule)s?\s+(?:supersede|override|replace|take\s+precedence\s+over))'
    tags: [override]

  - id: io.override_directives
    description: Direct command to override the assistant directives.
    family: instruction_override
    severity: high
    pattern: '(?:override|bypass|circumvent|suspend|cancel)\s+(?:your\s+|the\s+|all\s+)?(?:prior|previous|existing|current|original|earlier)?\s*(?:directive|instruction|rule|guideline|restriction|constraint|policy|guardrail)s?'
    tags: [override]

  - id: io.role_reassignment
    description: Redefining the assistant identity mid-conversation.
    family: instruction_override
    severity: medium
    pattern: '(?:you\s+are\s+now|from\s+now\s+on\s+you\s+(?:are|will\s+be)|your\s+new\s+(?:role|identity|persona)\s+is)\b'
    tags: [persona]

  - id: io.end_of_context
    description: Faking the end of untrusted content to escape a fence.
    family: instruction_override
    severity: critical
    pattern: '(?:end\s+of\s+(?:document|context|data|input|untrusted)|</(?:document|context|data|untrusted)>|```\s*(?:end|stop))'
    max_trust: third_party
    tags: [fence-escape]

  # --- addressed-to-the-model tells (indirect injection) --------------------
  - id: ind.note_to_ai
    description: Content that addresses the model rather than the reader.
    family: indirect
    severity: high
    pattern: '(?:note|message|instruction|important)s?\s+(?:to|for)\s+(?:the\s+)?(?:ai|assistant|model|llm|chatbot|agent|language\s+model)\b'
    max_trust: third_party
    tags: [indirect, high-signal]

  - id: ind.ai_reading_this
    description: Direct address to a model parsing the document.
    family: indirect
    severity: high
    pattern: '(?:if\s+you\s+are\s+(?:an?\s+)?(?:ai|assistant|language\s+model|llm)|when\s+(?:summar|process|read)\w*\s+this\s+(?:page|document|file|email))'
    max_trust: third_party
    tags: [indirect]

  - id: ind.hidden_directive
    description: Content claiming to be invisible to the human user.
    family: indirect
    severity: high
    pattern: '(?:hidden|invisible|do\s+not\s+(?:show|display|mention|reveal))\s+(?:from|to)?\s*(?:the\s+)?(?:user|human|reader|screen)'
    max_trust: third_party
    tags: [indirect, stealth]

  # --- system prompt leakage ------------------------------------------------
  - id: leak.repeat_above
    description: Verbatim-echo request aimed at the system prompt.
    family: sysprompt_leak
    severity: high
    pattern: '(?:repeat|print|output|echo|show|display|reveal|recite)\s+(?:back\s+)?(?:me\s+)?(?:everything|all|the\s+text|your\s+\w+)?\s*(?:above|before|preceding|verbatim|word\s+for\s+word)'
    tags: [leak]

  - id: leak.system_prompt_request
    description: Direct request for the system prompt or configuration.
    family: sysprompt_leak
    severity: high
    pattern: '(?:what\s+(?:is|are|was)|show|reveal|print|tell\s+me|repeat|recite|list|reproduce|output|display|give\s+me)\s+(?:me\s+)?(?:your|the)\s+(?:\w+\s+){0,2}?(?:system\s+prompt|initial\s+(?:instruction|prompt|configuration)|original\s+instruction|prompt\s+template|configuration|guideline|directive|instruction)s?'
    tags: [leak]

  - id: leak.delimiter_probe
    description: Probing for the boundary of the system message.
    family: sysprompt_leak
    severity: medium
    pattern: '(?:everything\s+(?:above|before)\s+(?:this|the)\s+(?:line|point|message)|the\s+text\s+between\s+.{0,20}(?:tags|delimiters|markers))'
    tags: [leak, probe]

  - id: leak.own_delimiters
    description: Names the assistant's own instruction fencing.
    family: sysprompt_leak
    severity: high
    # Distinct from leak.delimiter_probe, which stays medium because "the text
    # between the <p> tags" is an ordinary extraction request. Naming the
    # *assistant's* instruction delimiters is not: there is no reason to refer
    # to them except to find out what they enclose.
    pattern: '(?:your|the)\s+(?:instruction|system|prompt|context)\s+(?:delimiter|marker|fence|boundar|separator|wrapper)\w*'
    tags: [leak, probe, high-signal]

  - id: leak.quote_verbatim
    description: Anaphoric request to reproduce earlier text word for word.
    family: sysprompt_leak
    severity: medium
    # Medium on purpose. "Quote that exactly" is a legitimate thing to ask
    # about a document, so this earns its keep as corroboration -- it is what
    # turns a crescendo's innocuous-looking final turn into a detection once
    # L6 has watched the ladder climb toward the system prompt.
    pattern: '(?:quote|reproduce|repeat|recite|output|print)\s+(?:them|those|these|it|that)\s+(?:exactly|verbatim|word\s+for\s+word|precisely)\b|\bas\s+(?:they|it)\s+(?:were|was)\s+(?:written|given|provided|phrased)\s+to\s+you'
    tags: [leak, multiturn]

  # --- exfiltration ---------------------------------------------------------
  - id: exf.markdown_image_beacon
    description: Markdown image whose URL carries a query payload.
    family: exfiltration
    severity: critical
    pattern: '!\[[^\]]*\]\(\s*https?://[^\s)]+[?&][^\s)]*=[^\s)]+\)'
    tags: [exfil, zero-click, high-signal]

  - id: exf.image_with_placeholder
    description: Image URL templated with content for the model to fill in.
    family: exfiltration
    severity: critical
    pattern: '!\[[^\]]*\]\([^)]*\{\{?[^}]{1,60}\}?\}[^)]*\)'
    tags: [exfil, zero-click]

  - id: exf.send_data_to_url
    description: Instruction to transmit context to an external endpoint.
    family: exfiltration
    severity: critical
    pattern: '(?:send|post|upload|transmit|forward|exfiltrate|report|submit|e-?mail|leak|share)\s+(?:\w+\s+){0,3}?(?:conversation|history|data|content|context|secret|key|token|credential|password|result|everything|file|document|record|message|transcript|log)s?\b[^.\n]{0,60}?\b(?:to|at|via)\s+(?:https?://|www\.|[\w.-]+\.[a-z]{2,})'
    tags: [exfil]

  - id: exf.append_to_url
    description: Instruction to encode context into a URL the model emits.
    family: exfiltration
    severity: critical
    pattern: '(?:append|encode|include|embed|add|concatenate)\s+(?:the\s+)?[^.\n]{0,40}?(?:secret|key|token|password|conversation|history|context|data|summary)[^.\n]{0,40}?\b(?:to|in|into|onto)\s+(?:the\s+)?(?:url|link|query|image|address|endpoint)'
    tags: [exfil]

  - id: exf.recipient_address
    description: Instruction to send captured context to a named mailbox.
    family: exfiltration
    severity: critical
    # exf.send_data_to_url covers hosts and URLs; a bare email address slipped
    # past it, because the address form has no dot before the @.
    #
    # The object list is deliberately narrow -- the model's own context and
    # credentials, not documents in general. "Send the meeting transcript to
    # notes@ourcompany.com" is a user asking for their own work to be mailed
    # somewhere, and it is indistinguishable in text from the attack; only
    # authority separates them, which is ADR 002's entire argument and L4's
    # job, not a signature's. Widening this rule to catch that shape blocked
    # ordinary mail requests, so it stays narrow and L4 holds the line.
    pattern: '(?:send|forward|email|e-?mail|mail|deliver|share|cc|bcc|copy|transmit|relay|exfiltrate)\s+(?:\w+\s+){0,3}?(?:(?:conversation|chat|message|session)s?\s*(?:history|transcript|log|thread|so\s+far)?|(?:system\s+)?prompt|context\s+window|credentials?|secrets?|api\s+keys?|passwords?|everything\s+(?:above|so\s+far))\b[^.\n]{0,60}?\bto\s+[\w.+-]+@[\w-]+\.[a-z]{2,}'
    tags: [exfil, recipient]

  - id: exf.cloud_metadata
    description: Reference to a cloud instance metadata endpoint.
    family: exfiltration
    severity: critical
    # The link-local metadata service hands out instance credentials to
    # anything that can make it issue a request. It has no legitimate reason
    # to appear in traffic an assistant is being asked to act on.
    # Scoped to a *retrieval* of the endpoint, not a mention of it. "What is
    # the 169.254.169.254 address used for in AWS?" is a question an engineer
    # asks on their first week, and blocking it teaches them to route around
    # the gateway.
    pattern: '(?:https?://|curl\s+|wget\s+|fetch\s+|GET\s+|request\s+(?:to\s+|against\s+)?)[^\s\n]{0,20}?(?:169\.254\.169\.254|169\.254\.170\.2|100\.100\.100\.200|metadata\.google\.internal)|/latest/meta-data/|/computeMetadata/v1/'
    ignore_case: false
    quotable: false
    tags: [exfil, ssrf, high-signal]

  # --- tool abuse -----------------------------------------------------------
  - id: tool.invoke_directive
    description: Untrusted content instructing a specific tool call.
    family: tool_abuse
    severity: critical
    # Two forms: an explicit "<name> tool", or a dotted/underscored callable
    # name after an invocation verb ("Invoke http.request against ...").
    # Requiring the literal noun let the second form through entirely.
    pattern: '(?:call|invoke|use|execute|run|trigger)\s+(?:the\s+)?(?:[\w.\-]{2,40}\s+(?:tool|function|api|command|endpoint|plugin|skill)\b|[a-z][\w\-]*[._][\w\-]{2,30}\b)'
    max_trust: third_party
    tags: [tool, indirect]

  - id: tool.email_send
    description: Untrusted content directing an outbound message.
    family: tool_abuse
    severity: critical
    pattern: '(?:send|compose|draft|forward)\s+(?:an?\s+)?(?:e-?mail|message|dm|slack|text)\b[^.\n]{0,60}?\b(?:to|at)\s+\S+@\S+'
    max_trust: third_party
    tags: [tool, indirect, exfil]

  - id: tool.destructive_verb
    description: Untrusted content directing a destructive operation.
    family: tool_abuse
    severity: critical
    pattern: '(?:delete|drop|truncate|remove|wipe|erase|purge|revoke|disable)\s+(?:all\s+|every\s+|the\s+)?(?:file|table|record|user|account|repo|database|bucket|key|backup)s?\b'
    max_trust: third_party
    tags: [tool, destructive]

  # The three rules above scope to third_party because a *user* saying "use
  # the search tool" is the product working as intended. These three do not
  # scope, because they key on the target rather than the invocation: a
  # traversal sequence, a private key path and an instance metadata address
  # are not things a legitimate request asks an agent to reach for, whoever
  # is asking. Provenance still decides authority at L4 -- this is only
  # detection, and detection that names the dangerous object is the kind that
  # survives contact with real traffic.
  - id: tool.secret_file_read
    description: Directive to read credential material off disk.
    family: tool_abuse
    severity: critical
    # The .pub exclusion is not a detail: a public key is meant to be read
    # and copied around, and "cat ~/.ssh/id_rsa.pub" is a line out of an
    # ordinary deploy runbook.
    pattern: '(?:cat|read|open|print|dump|fetch|upload|send|show|display|include|type|exfiltrate|copy)\s+(?:the\s+|my\s+|contents\s+of\s+)?[^\n]{0,40}?(?:~?/?\.ssh/id_[a-z]+|\bid_rsa\b|\.aws/credentials|\.git-credentials|/etc/(?:shadow|passwd)|\.kube/config|\bcredentials\.json\b|\.npmrc\b|\.pypirc\b)(?!\.pub\b)(?!\w)'
    quotable: false
    tags: [tool, secrets, high-signal]

  - id: tool.path_traversal
    description: Traversal sequence aimed at a sensitive file.
    family: tool_abuse
    severity: critical
    # Traversal alone is not enough: '../../lib/util' is an ordinary relative
    # import someone might paste into a coding question. Neither is traversal
    # plus a secret target -- "why does open('../../.env') work locally but
    # fail in CI?" is a support question, and an early draft of this rule
    # blocked it. What is not ordinary is naming a *callable* and pointing it
    # at a secret path: that is a request to make an agent go and read it.
    pattern: '(?:[\w\-]{2,30}\s+(?:tool|function|api|endpoint|plugin|command)|[a-z][\w\-]*[._][\w\-]{2,30})\b[^\n]{0,40}?(?:\.\.[\/]){2,}[^\s\n]{0,40}?(?:\.env\b|\.ssh|credentials?\b|secrets?\b|passwd|shadow|id_rsa|\.pem\b|\.key\b)'
    quotable: false
    tags: [tool, traversal, high-signal]

  - id: tool.destructive_sql
    description: Tool invocation carrying a destructive SQL statement.
    family: tool_abuse
    severity: critical
    # The target has to be a named callable. Requiring only an invocation verb
    # still fired on "run the migration script that will DROP TABLE
    # legacy_sessions -- is that safe on a live database?", which is a DBA
    # asking a sensible question about their own database.
    pattern: '(?:call|invoke|use|run|execute|query|issue)\s+(?:the\s+)?(?:[\w\-]{2,40}\s+(?:tool|function|api|endpoint|plugin)|[a-z][\w\-]*[._][\w\-]{2,30})\b[^\n]{0,40}?\b(?:drop|truncate)\s+(?:table|database|schema)\b'
    tags: [tool, destructive, sql]

  # --- jailbreak framing ----------------------------------------------------
  - id: jb.persona_dan
    description: Named jailbreak personas.
    family: roleplay
    # High, not medium: these strings have no benign use as an instruction.
    # Someone *discussing* them is handled by the quoted-context discount in
    # L1 rather than by keeping the severity artificially low, which only
    # pushed real attacks below the review threshold.
    severity: high
    pattern: '\b(?:DAN|STAN|DUDE|AIM|developer\s+mode|do\s+anything\s+now|jailbr(?:eak|oken))\b'
    tags: [jailbreak]

  - id: jb.restriction_lift
    description: Framing that claims restrictions no longer apply.
    family: roleplay
    severity: high
    pattern: '(?:no\s+(?:longer\s+)?(?:bound|restricted|limited)\s+by|without\s+(?:any\s+)?(?:restriction|limitation|filter|guardrail|censorship)|bypass\s+(?:your\s+)?(?:filter|restriction|guardrail|safety))'
    tags: [jailbreak]

  - id: jb.capability_claim
    description: Asserts the assistant has no policy or guardrails.
    family: roleplay
    severity: high
    pattern: '(?:(?:have|has|with)\s+no\s+(?:content\s+)?(?:policy|policies|restriction|limit|guardrail|filter|rule)s?)|(?:not\s+bound\s+by\s+(?:any\s+)?(?:rule|restriction|guideline|policy|constraint)s?)|(?:no\s+longer\s+bound\s+by)'
    tags: [jailbreak]

  - id: jb.hypothetical_framing
    description: Fiction framing used to launder a disallowed request.
    family: roleplay
    severity: low
    pattern: '(?:hypothetically|in\s+a\s+fictional|pretend\s+(?:that\s+)?you|imagine\s+you\s+are|for\s+(?:a\s+)?(?:story|novel|research)\s+purposes?)\b[^.\n]{0,80}?\b(?:no\s+rules|anything|unrestricted|illegal)'
    tags: [jailbreak, low-precision]

  # --- encoding / smuggling -------------------------------------------------
  # Invisible-character classes are written as regex escapes on purpose: a
  # literal zero-width character in this file would be unreviewable in a diff.
  - id: enc.base64_blob
    description: Long base64 run, a common smuggling envelope.
    family: encoding
    severity: low
    pattern: '(?<![A-Za-z0-9+/])[A-Za-z0-9+/]{60,}={0,2}(?![A-Za-z0-9+/])'
    ignore_case: false
    tags: [encoding]

  - id: enc.decode_and_obey
    description: Instruction to decode a payload and act on it.
    family: encoding
    severity: critical
    pattern: '(?:decode|decrypt|de-?obfuscate|base64|rot-?13|reverse)\s+(?:the\s+)?(?:following|this|below|string|text|payload)[^.\n]{0,60}?\b(?:and\s+)?(?:then\s+)?(?:follow|execute|obey|do|run|comply|act)'
    tags: [encoding, high-signal]

  - id: enc.zero_width
    description: Zero-width, soft-hyphen or bidi control characters hiding text.
    family: encoding
    severity: high
    pattern: '[​-‏‪-‮⁠-⁤­﻿]'
    ignore_case: false
    tags: [encoding, stealth]

  - id: enc.tag_chars
    description: Unicode Tag block, invisible to humans and readable by models.
    family: encoding
    severity: critical
    pattern: '[\U000e0000-\U000e007f]'
    ignore_case: false
    tags: [encoding, stealth, high-signal]

  # --- authority / urgency pressure ----------------------------------------
  - id: soc.fake_authority
    description: Claimed authorization from the operator or vendor.
    family: instruction_override
    severity: medium
    pattern: '(?:authorized|approved|sanctioned|permitted|cleared)\s+by\s+(?:openai|anthropic|google|the\s+(?:developer|admin|operator|owner|company))'
    max_trust: third_party
    tags: [social]

  - id: soc.override_code
    description: Fabricated override or maintenance credential.
    family: instruction_override
    severity: high
    pattern: '(?:override|admin|master|maintenance|debug|god)\s*(?:code|key|token|password|mode)\s*[:=]\s*\S+'
    max_trust: third_party
    tags: [social, spoof]
