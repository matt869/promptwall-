name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Tests build settings explicitly, but a stray value in the environment
  # should never be able to change what the suite asserts.
  PW_AUTH_REQUIRED: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy promptwall

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # The gateway is developed on Windows, so it is tested there too.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,redis]"
      - name: pytest
        run: pytest -q --cov=promptwall --cov-report=xml
      - name: config and policy validate
        run: python -m promptwall.main check
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  # Policy is data, and a rule that fails validation is a silently missing
  # security control. Checked separately so the failure is legible.
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: validate policy packs
        run: |
          python - <<'PY'
          from promptwall.policy.loader import load_bundle
          bundle = load_bundle()
          summary = bundle.summary()
          print(summary)
          assert summary["signatures"] > 0, "no signatures loaded"
          assert summary["tool_rules"] > 0, "no tool rules loaded"
          assert summary["tool_default"] == "deny", "tool default must stay deny"
          PY

  # The gate that catches the failure unit tests cannot: loosening a rule to
  # fix one false positive and quietly losing three attack families.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: generate corpora
        run: python scripts/seed_datasets.py
      - name: run benchmark
        run: python bench/harness/runner.py --out /tmp/results.json
      - name: regression gate
        run: |
          python scripts/bench_delta.py \
            bench/results/2026-08-26/results.json /tmp/results.json --only promptwall
      - name: report
        if: always()
        run: python bench/harness/report.py /tmp/results.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: /tmp/results.json

  # Deployment manifests are code that only fails at deploy time otherwise.
  # This job exists because a review caught a kustomization referencing a
  # ConfigMap and a Redis service that did not exist -- valid YAML, dangling
  # references, and pods stuck in ContainerCreating.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render kustomize
        run: |
          kubectl kustomize . > /tmp/rendered.yaml
          echo "rendered $(grep -c '^kind:' /tmp/rendered.yaml) manifests"
      - name: every reference resolves
        run: |
          python - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/rendered.yaml")) if d]
          names = {(d["kind"], d["metadata"]["name"]) for d in docs}

          dep = next(d for d in docs
                     if d["kind"] == "Deployment" and d["metadata"]["name"] == "promptwall")
          spec = dep["spec"]["template"]["spec"]

          for volume in spec.get("volumes", []):
              if "configMap" in volume:
                  ref = ("ConfigMap", volume["configMap"]["name"])
                  assert ref in names, f"dangling volume reference: {ref}"

          # The Redis URL must name a Service that this kustomization creates.
          url = next(e["value"] for e in spec["containers"][0]["env"]
                     if e["name"] == "PW_REDIS_URL")
          host = url.split("//")[1].split(":")[0]
          assert ("Service", host) in names, f"PW_REDIS_URL points at missing Service {host}"

          print(f"{len(docs)} manifests, all references resolve")
          PY
      - name: validate compose
        run: docker compose config --quiet && echo "compose config valid"
      - name: grafana provisioning is present
        run: |
          # Mounting dashboard JSON without a provider silently loads nothing.
          test -f deploy/grafana/provisioning/dashboards/promptwall.yml
          test -f deploy/grafana/provisioning/datasources/prometheus.yml
          python -c "import json;json.load(open('deploy/grafana/dashboards/promptwall.json'))"
          echo "grafana provisioning ok"

  # Verifies the container actually serves traffic, rather than only building.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: promptwall:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: run and smoke test
        run: |
          docker run -d --name pw -p 8080:8080 \
            -e PW_UPSTREAM_PROVIDER=echo \
            -e PW_UPSTREAM_API_KEY=none \
            -e PW_API_KEYS=ci-key \
            -e PW_MODE=enforce \
            -e PW_AUDIT_ENABLED=false \
            promptwall:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz >/dev/null && break
            sleep 1
          done
          bash scripts/smoke_test.sh http://localhost:8080 ci-key
      - name: container logs
        if: failure()
        run: docker logs pw

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # Exits non-zero if anything leaked, or if a clean request was cut.
      - name: injection is stopped and clean traffic is not
        run: python demo/vulnerable_app/app.py
